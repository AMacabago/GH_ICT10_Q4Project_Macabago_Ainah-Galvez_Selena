<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.3.1/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxygen:wght@300;400;700&family=Raleway:wght@300;400;700&display=swap" rel="stylesheet">

    <title>My Classmates</title>
    <style>
        body {
            font-family: "Raleway", sans-serif;
            background-color: rgba(255, 210, 217, 0.606);
            margin: 0;
            padding: 0;
        }

        .container-box {
            max-width: 350px;
            height: auto;
            margin: 70px auto;
            padding: 20px;
            box-shadow: 10px 10px 5px rgba(0,0,0,0.75);
            background-color: #b7b0b7;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        input {
            margin: 5px 0;
            padding: 5px;
            border-radius: 10px;
            border: none;
            width: 90%;
            font-family: "Raleway", sans-serif;
        }

        h1 {
            font-weight: 700;
        }

        h5 {
            color: #444;
            font-weight: 300;
        }

        .navbar {
            background-color: palevioletred;
        }

        .btn-custom {
            background-color: pink;
            font-family: "Raleway", sans-serif;
        }

        .btn-custom:hover {
            background-color: rgb(251, 160, 175);
        }

        #output {
            margin-top: 10px;
            text-align: left;
            color: black;
            background: white;
            padding: 10px;
            border-radius: 10px;
            font-family: "Raleway", sans-serif;
        }
    </style>
</head>

<body>
<!-- GALVEZ -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <h3 class="text-light p-2">10 Sapphire</h3>

        <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">CLASSMATE SYSTEM</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">TRACKER</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="#">HIGHLIGHTS</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-box">
    <h1>Grade 10 Classmates System</h1>
    <h5>Add and view your classmates easily</h5>

    <form>
        <input type="text" id="name" placeholder="Enter your name"><br>
        <input type="text" id="section" placeholder="Enter your section"><br>
        <input type="text" id="subject" placeholder="Enter your favorite subject"><br>

        <div id="output"></div>

        <input type="button" class="btn btn-custom mt-2" py-click="show_list" value="Show list">
        <input type="button" class="btn btn-custom mt-2" py-click="add_classmate" value="Add Classmate">
    </form>
</div>

<py-script src="main.py"></py-script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
